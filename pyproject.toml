[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-agent"
version = "0.3.1"
description = "A citation-first enterprise knowledge-base RAG agent."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "pydantic>=2.7,<3.0",
  "pypdf>=5.0,<7.0",
  "python-docx>=1.1,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
  "httpx>=0.27,<1.0",
  "qdrant-client>=1.19,<1.20",
]
server = [
  "qdrant-client>=1.19,<1.20",
  "sentence-transformers>=3.4,<6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "api*", "agent*", "ingestion*", "retrieval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
