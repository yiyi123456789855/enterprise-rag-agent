services:
  rag-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /app/data
      DATABASE_PATH: /app/data/rag.db
    volumes:
      - rag_data:/app/data
    restart: unless-stopped

  # Reserved for the BGE-M3 + Qdrant upgrade in milestone 2.
  qdrant:
    image: qdrant/qdrant:v1.19.0
    profiles: ["production-infra"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    profiles: ["production-infra"]
    ports:
      - "6379:6379"

volumes:
  rag_data:
  qdrant_data:
